<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenhouse Logger Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header id="dashboard-header">
      <a href="#dashboard-header" class="dashboard-logo">
        <span class="logo-icon" aria-hidden="true">&#9762;</span>
        <h1>Greenhouse Logger</h1>
      </a>

      <div id="dashboard-status">
        <p>Entries: <span id="entries-count">0</span></p>
      </div>
    </header>

    <main>
      <section id="form-container" class="section-container">
        <h2 id="form-title" class="section-title">
          Record Greenhouse Sensor Reading
        </h2>

        <div id="form-error-message" aria-live="polite"></div>
        <p id="form-range-message" aria-live="polite"></p>

        <form action="#" id="sensor-form" novalidate>
          <div class="form-group form-group-wide">
            <label for="technician-first" class="form-label">
              First Name
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="text"
              name="technicianFirst"
              id="technician-first"
              class="form-input"
              placeholder="John"
              required
            />
          </div>

          <div class="form-group form-group-wide">
            <label for="technician-last" class="form-label">
              Last Name
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="text"
              name="technicianLast"
              id="technician-last"
              class="form-input"
              placeholder="Smith"
              required
            />
          </div>

          <div class="form-group form-group-wide">
            <label for="bay-id" class="form-label">
              Greenhouse Bay
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="text"
              name="bayId"
              id="bay-id"
              class="form-input"
              placeholder="Bay A"
              required
            />
          </div>

          <div class="form-group">
            <label for="ph-reading" class="form-label">
              pH
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="number"
              name="phReading"
              id="ph-reading"
              class="form-input"
              min="0"
              max="14"
              step="0.1"
              placeholder="6.0"
              required
            />
          </div>

          <div class="form-group">
            <label for="ec-reading" class="form-label">
              Electrical Conductivity (mS/cm)
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="number"
              name="ecReading"
              id="ec-reading"
              class="form-input"
              min="0"
              step="0.1"
              placeholder="1.5"
              required
            />
          </div>

          <div class="form-group">
            <label for="temperature-reading" class="form-label">
              Air Temperature (°F)
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="number"
              name="temperatureReading"
              id="temperature-reading"
              class="form-input"
              min="0"
              step="0.1"
              placeholder="68.0"
              required
            />
          </div>

          <div class="form-group">
            <label for="humidity-reading" class="form-label">
              Relative Humidity (%)
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="number"
              name="humidityReading"
              id="humidity-reading"
              class="form-input"
              min="0"
              max="100"
              step="1"
              placeholder="60"
              required
            />
          </div>

          <button type="submit" id="record-reading-btn" class="btn">
            Record Reading
          </button>
        </form>
      </section>

      <section id="records-container" class="section-container">
        <header id="records-header">
          <h2 id="records-title" class="section-title">Entries</h2>
          <button id="clear-all-btn" class="btn" type="button">
            Purge All Entries
          </button>
        </header>

        <!-- Static empty state  -->
        <div id="empty-state">
          <span class="empty-icon" aria-hidden="true">📋</span>
          <p>No active records logged.</p>
        </div>

        <!-- Dynamic populated state -->
        <ul id="records-list" aria-live="polite"></ul>
      </section>
    </main>

    <footer id="dashboard-footer">
      <p id="footer-copy">
        &copy; 2026 Greenhouse Logger, CSI-3150 Assignment-2B
      </p>
    </footer>

    <script src="./app.js"></script>
  </body>
</html>
